schema_version: 1

context:
  build_number: 54

package:
  name: cross-python_${{ cross_target_platform|default("linux-64") }}
  version: ${{ version|default("0.1") }}

build:
  number: ${{ build_number }}
  string: ${{ build_number }}_${{ py_impl }}
  skip:
    - not (build_platform == "win-64" and cross_target_platform == "win-arm64" and version == "3.14")

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
  run:
    - python ${{ version }}.* *_${{ py_impl }}
    - crossenv >=1.1.4
    - if: unix
      then:
        - rsync
        - sed
      else:
        - m2-sed
    - if: cross_target_platform in ("osx-64", "osx-arm64")
      then: clangxx_impl_${{ cross_target_platform }}
    - if: cross_target_platform in ("linux-64", "linux-aarch64", "linux-ppc64le")
      then: gxx_impl_${{ cross_target_platform }}
    - if: cross_target_platform in ("win-arm64")
      then: vs_${{ cross_target_platform }}
  run_exports:
    strong:
      - python ${{ version }}.* *_${{ py_impl }}

tests:
  - if: cross_target_platform not in ("osx-64", "osx-arm64")
    then:
      - script:
        - test -f $PREFIX/etc/conda/activate.d/activate_z-cross-python_${{ cross_target_platform }}.sh
        - echo ${{ freethreading }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A meta-package to set up a cross compiling env for python in conda-build
  homepage: https://github.com/conda-forge/cross-python-feedstock

extra:
  recipe-maintainers:
    - chrisburr
    - isuruf
  feedstock-name: cross-python
